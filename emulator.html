<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>N64 Core Engine</title>
  
  <script src="coi-serviceworker.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background-color: #000; overflow: hidden; }
    #game { width: 100vw; height: 100vh; }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #00e5ff;
      font-family: monospace;
      font-size: 1.2rem;
      text-align: center;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div id="loading">Initializing Mupen64Plus Core...</div>
  <div id="game"></div>

  <script>
    // --- IndexedDB Access to Retrieve Binary ROM ---
    const DB_NAME = 'N64EmulatorDB';
    const STORE_NAME = 'roms';

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function getStoredRom() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.get('active_rom');
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function launchCore() {
      try {
        const romData = await getStoredRom();
        if (!romData || !romData.buffer) {
          document.getElementById('loading').innerText = 'ERROR: ROM data not found in storage.';
          return;
        }

        // Convert stored ArrayBuffer to Object URL
        const blob = new Blob([romData.buffer], { type: 'application/octet-stream' });
        const romUrl = URL.createObjectURL(blob);
        const cleanTitle = romData.name.replace(/\.[^.]+$/, "");

        // --- EmulatorJS Global Settings ---
        window.EJS_player = '#game';
        window.EJS_core = 'n64';
        window.EJS_gameUrl = romUrl;
        window.EJS_gameName = cleanTitle;
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        window.EJS_color = '#00e5ff';
        window.EJS_startOnLoaded = true;

        // Force touch controller visibility and options
        window.EJS_buttons = {
          playCounter: false,
          settings: true,
          fullscreen: true,
          saveState: true,
          loadState: true,
          gamepad: true, // Enables touch gamepad toggle
          cheat: true,
          volume: true,
          quickSave: true,
          quickLoad: true,
          screenshot: true,
          restart: true
        };

        // Load Official EmulatorJS Engine Script
        const script = document.createElement('script');
        script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
        script.onload = () => {
          const l = document.getElementById('loading');
          if (l) l.style.display = 'none';
        };
        document.body.appendChild(script);

      } catch (err) {
        document.getElementById('loading').innerText = 'Launch Error: ' + err.message;
      }
    }

    launchCore();
  </script>
</body>
</html>
