<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>N64 Web Emulator</title>
  <!-- Tailwind CSS for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    body {
      background-color: #0f172a;
      color: white;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    .font-display { font-family: 'Orbitron', sans-serif; }
    
    /* Neon Glow Effects */
    .glow-text { text-shadow: 0 0 10px rgba(0, 229, 255, 0.7); }
    .glow-box { box-shadow: 0 0 20px rgba(0, 229, 255, 0.2); }
    
    /* Screen Transitions */
    .screen {
      display: none;
      animation: fadeIn 0.4s ease-out forwards;
    }
    .screen.active { display: flex; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse-fast {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    .animate-accept { animation: pulse-fast 0.5s infinite; }

    /* Drag & Drop Area */
    #drop-zone.dragover {
      border-color: #00e5ff;
      background-color: rgba(0, 229, 255, 0.05);
    }

    /* Emulator container needs to take full screen when active */
    #emulator-screen {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: black;
      z-index: 50;
    }
    #game-container { width: 100%; height: 100%; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative">

  <!-- SCREEN 1: UPLOAD ROM -->
  <div id="upload-screen" class="screen active flex-col items-center justify-center w-full max-w-2xl p-6 text-center">
    <h1 class="font-display text-4xl font-bold mb-2 text-[#00e5ff] glow-text">NINTENDO 64</h1>
    <p class="text-slate-400 mb-8">Web System Emulator</p>
    
    <div id="drop-zone" class="w-full h-64 border-2 border-dashed border-slate-600 rounded-2xl flex flex-col items-center justify-center transition-all cursor-pointer hover:border-[#00e5ff] hover:bg-slate-800/50">
      <svg class="w-12 h-12 text-slate-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
      <p class="text-lg font-semibold text-slate-200">Drag & Drop your N64 ROM here</p>
      <p class="text-sm text-slate-500 mt-2">Supports .z64, .n64, .v64</p>
      <input type="file" id="file-input" class="hidden" accept=".z64,.n64,.v64" />
    </div>
    <button onclick="document.getElementById('file-input').click()" class="mt-6 px-6 py-3 bg-slate-800 hover:bg-slate-700 text-[#00e5ff] font-display font-bold rounded-lg transition-colors border border-slate-700 hover:border-[#00e5ff]">
      BROWSE FILES
    </button>
  </div>

  <!-- SCREEN 2: ACCEPTED TRANSITION -->
  <div id="accepted-screen" class="screen flex-col items-center justify-center w-full h-full absolute inset-0 bg-[#0f172a] z-10">
    <h2 class="font-display text-5xl font-bold text-[#00e5ff] glow-text animate-accept tracking-widest">ROM ACCEPTED</h2>
    <p id="accepted-filename" class="mt-4 text-slate-400 font-mono"></p>
  </div>

  <!-- SCREEN 3: HOME MENU -->
  <div id="home-screen" class="screen flex-col items-center justify-center w-full max-w-4xl p-6">
    <div class="w-full flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
      <h2 class="font-display text-2xl text-slate-300">HOME MENU</h2>
      <div class="flex gap-2">
        <div class="w-3 h-3 rounded-full bg-slate-600"></div>
        <div class="w-3 h-3 rounded-full bg-slate-600"></div>
        <div class="w-3 h-3 rounded-full bg-[#00e5ff] glow-box"></div>
      </div>
    </div>

    <div class="flex flex-col md:flex-row gap-8 items-center bg-slate-800/40 p-8 rounded-2xl border border-slate-700 w-full backdrop-blur-sm">
      <!-- Box Art Container -->
      <div class="w-48 h-64 shrink-0 bg-black rounded-lg border-2 border-slate-600 flex items-center justify-center overflow-hidden relative shadow-2xl">
        <img id="game-boxart" src="" alt="Box Art" class="w-full h-full object-cover hidden" />
        <div id="boxart-fallback" class="font-display text-2xl text-slate-600 tracking-widest">N64</div>
      </div>
      
      <!-- Game Details -->
      <div class="flex flex-col flex-1">
        <p class="text-[#00e5ff] font-mono text-sm mb-1">READY TO PLAY</p>
        <h3 id="game-title" class="text-3xl font-bold text-white mb-2 break-all"></h3>
        <p class="text-slate-400 mb-8 max-w-lg">EmulatorJS Core: Mupen64Plus. Game data is loaded securely into local memory.</p>
        
        <button id="btn-play" class="px-8 py-4 bg-[#00e5ff] hover:bg-[#00cce6] text-black font-display font-bold text-xl rounded-lg transition-transform hover:scale-105 active:scale-95 shadow-[0_0_20px_rgba(0,229,255,0.4)] max-w-xs flex items-center justify-center gap-3">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4l12 6-12 6z"></path></svg>
          START GAME
        </button>
      </div>
    </div>
    
    <button onclick="location.reload()" class="mt-8 text-slate-500 hover:text-white transition-colors underline text-sm">
      Load a different ROM
    </button>
  </div>

  <!-- SCREEN 4: EMULATOR -->
  <div id="emulator-screen" class="screen">
    <div id="game-container"></div>
  </div>

  <script>
    // --- State Variables ---
    let romFile = null;
    let romUrl = null;

    // --- DOM Elements ---
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const screenUpload = document.getElementById('upload-screen');
    const screenAccepted = document.getElementById('accepted-screen');
    const screenHome = document.getElementById('home-screen');
    const screenEmulator = document.getElementById('emulator-screen');
    const btnPlay = document.getElementById('btn-play');

    // --- File Handling (Drag & Drop + Click) ---
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) {
        processFile(e.dataTransfer.files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        processFile(e.target.files[0]);
      }
    });

    function processFile(file) {
      romFile = file;
      romUrl = URL.createObjectURL(file); // Create local blob URL for EmulatorJS
      
      // Extract clean title
      const filename = file.name;
      const cleanTitle = filename.replace(/\.[^.]+$/, "");
      
      // Update UI
      document.getElementById('accepted-filename').innerText = filename;
      document.getElementById('game-title').innerText = cleanTitle;

      // Switch to ACCEPTED screen
      switchScreen(screenAccepted);

      // Attempt to load Box Art in the background
      loadBoxArt(filename);

      // Hold accepted screen for 1.5s, then go to HOME screen
      setTimeout(() => {
        switchScreen(screenHome);
      }, 1500);
    }

    // --- UI Utility ---
    function switchScreen(activeScreen) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      activeScreen.classList.add('active');
    }

    // --- Box Art Logic (Ported from your React code) ---
    async function loadBoxArt(filename) {
      const stem = filename.replace(/\.[^.]+$/, "");
      const candidates = new Set();

      candidates.add(stem);
      candidates.add(stem.replace(/_/g, " "));
      candidates.add(stem.replace(/\s+/g, " ").trim());
      
      const noTags = stem.replace(/\s*[\(\[][^\)\]]*[\)\]]/g, "").trim();
      candidates.add(noTags);
      candidates.add(noTags.replace(/_/g, " "));
      
      const base = stem.split(/[\(\[]/)[0].trim();
      candidates.add(base);
      
      if (noTags) candidates.add(`${noTags} (USA)`);
      if (base) {
        candidates.add(`${base} (USA)`);
        candidates.add(`${base} (Europe)`);
        candidates.add(`${base} (World)`);
        candidates.add(`${base} (Japan)`);
      }

      const sysDir = "Nintendo - Nintendo 64";
      const cdn = "https://thumbnails.libretro.com";
      const urls = Array.from(candidates).filter(Boolean).map(name => {
        const sanitized = name.replace(/[&*/:`<>?\\|"]/g, "_");
        return `${cdn}/${encodeURIComponent(sysDir)}/Named_Boxarts/${encodeURIComponent(sanitized)}.png`;
      });

      // Try URLs sequentially
      for (const url of urls) {
        const success = await tryLoadImage(url);
        if (success) {
          const imgEl = document.getElementById('game-boxart');
          imgEl.src = url;
          imgEl.classList.remove('hidden');
          document.getElementById('boxart-fallback').classList.add('hidden');
          break; // Stop on first successful image
        }
      }
    }

    function tryLoadImage(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(true);
        img.onerror = () => resolve(false);
        img.src = url;
      });
    }

    // --- EmulatorJS Initialization ---
    btnPlay.addEventListener('click', () => {
      switchScreen(screenEmulator);
      
      // Set Global Config for EmulatorJS
      window.EJS_player = '#game-container';
      window.EJS_core = 'n64'; // Tells EmulatorJS to use Mupen64plus
      window.EJS_gameUrl = romUrl; // Pass the local file blob URL
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/'; // Required core files
      window.EJS_color = '#00e5ff'; // Match our UI theme
      
      // Inject EmulatorJS loader
      const script = document.createElement('script');
      script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
